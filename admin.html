<script>
    const PROXY = "https://api.allorigins.win/get?url=";
    const SUPABASE_URL = "https://ebzkikyajxcqnpdxhpjw.supabase.co/rest/v1/reportes?select=*";
    const KEY = "sb_publishable_5KY63IWWB48yQohE_X29kQ_j22j75dO";

    async function cargar() {
        try {
            const finalUrl = PROXY + encodeURIComponent(SUPABASE_URL + "&apikey=" + KEY);
            const response = await fetch(finalUrl);
            const json = await response.json();
            const data = JSON.parse(json.contents); 

            // Si la tabla devuelve algo, el número cambiará sí o sí
            document.getElementById('total').innerText = data.length;

            if (data.length > 0) {
                const tipos = {}; const mats = {};
                
                data.forEach(r => {
                    // Buscamos cualquier columna que se parezca a "tipo" o "matricula"
                    // Esto arregla el problema si escribiste "Tipo" o "Matrícula"
                    const valorTipo = r.tipo || r.Tipo || r.tipo_averia || "Otro";
                    const valorMat = r.matricula || r.Matricula || r.matrícula || "Desconocido";

                    tipos[valorTipo] = (tipos[valorTipo] || 0) + 1;
                    mats[valorMat] = (mats[valorMat] || 0) + 1;
                });

                // Dibujar gráficas
                new Chart(document.getElementById('chart1'), { 
                    type: 'pie', 
                    data: { labels: Object.keys(tipos), datasets: [{ data: Object.values(tipos), backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56'] }] } 
                });
                new Chart(document.getElementById('chart2'), { 
                    type: 'bar', 
                    data: { labels: Object.keys(mats), datasets: [{ label: 'Averías', data: Object.values(mats), backgroundColor: '#34495e' }] } 
                });
            }
        } catch (e) {
            document.getElementById('total').innerText = "Error de datos";
        }
    }
    cargar();
</script>

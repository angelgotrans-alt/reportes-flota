<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Flota</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grande { font-size: 3em; font-weight: bold; color: #007bff; }
        canvas { max-width: 100%; height: 280px !important; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reportes Totales</h2>
        <div id="contador" class="grande">...</div>
    </div>
    <div class="card"><h3>Distribución por Tipo</h3><canvas id="grafico1"></canvas></div>
    <div class="card"><h3>Por Matrícula</h3><canvas id="grafico2"></canvas></div>

    <script>
        const URL = "https://ebzkikyajxcqnpdxhpjw.supabase.co/rest/v1/reportes?select=*";
        const KEY = "sb_publishable_5KY63IWWB48yQohE_X29kQ_j22j75dO";

        async function cargarDatos() {
            try {
                const res = await fetch(URL, {
                    headers: { "apikey": KEY, "Authorization": "Bearer " + KEY }
                });
                const datos = await res.json();
                
                // Actualizar número total
                document.getElementById('contador').innerText = datos.length;

                if (datos.length > 0) {
                    let tipos = {}; let mats = {};
                    datos.forEach(d => {
                        // Usamos nombres flexibles por si hay mayúsculas
                        let t = d.tipo || d.Tipo || "Otro";
                        let m = d.matricula || d.Matricula || "S/M";
                        tipos[t] = (tipos[t] || 0) + 1;
                        mats[m] = (mats[m] || 0) + 1;
                    });

                    // Gráfico 1
                    new Chart(document.getElementById('grafico1'), {
                        type: 'pie',
                        data: { labels: Object.keys(tipos), datasets: [{ data: Object.values(tipos), backgroundColor: ['#ff6384','#36a2eb','#ffce56'] }] }
                    });

                    // Gráfico 2
                    new Chart(document.getElementById('grafico2'), {
                        type: 'bar',
                        data: { labels: Object.keys(mats), datasets: [{ label: 'Cantidad', data: Object.values(mats), backgroundColor: '#007bff' }] }
                    });
                }
            } catch (err) {
                document.getElementById('contador').innerText = "Error";
                console.error(err);
            }
        }
        cargarDatos();
    </script>
</body>
</html>

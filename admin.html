<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Control Simplificado</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        canvas { max-height: 250px; }
    </style>
</head>
<body>

    <h2>📊 Estadísticas de Flota</h2>
    
    <div class="card">
        <h3>Total Reportes: <span id="total">0</span></h3>
    </div>

    <div class="card">
        <h3>Tipos de Avería</h3>
        <canvas id="chartTipos"></canvas>
    </div>

    <div class="card">
        <h3>Reportes por Matrícula</h3>
        <canvas id="chartVehiculos"></canvas>
    </div>

<script>
    const URL = "https://ebzkikyajxcqnpdxhpjw.supabase.co";
    const KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViemtpa3lhanhjcW5wZHhocGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDgyODIsImV4cCI6MjA5MzcyNDI4Mn0.u9Lyz-iLDpVNPVGCKv-CC50iY6lY4L-pqSyhglawOrs";
    
    async function loadStats() {
        try {
            // Solo pedimos las columnas que existen de verdad
            const res = await fetch(`${URL}/rest/v1/reportes?select=tipo,matricula`, { 
                headers: { "apikey": KEY, "Authorization": "Bearer " + KEY } 
            });
            const data = await res.json();
            
            if (!Array.isArray(data)) throw new Error();

            document.getElementById('total').innerText = data.length;

            const tipos = {};
            const vehiculos = {};

            data.forEach(r => {
                if(r.tipo) tipos[r.tipo] = (tipos[r.tipo] || 0) + 1;
                if(r.matricula) vehiculos[r.matricula] = (vehiculos[r.matricula] || 0) + 1;
            });

            new Chart(document.getElementById('chartTipos'), {
                type: 'pie',
                data: { labels: Object.keys(tipos), datasets: [{ data: Object.values(tipos), backgroundColor: ['#4299e1', '#ed8936'] }] }
            });

            new Chart(document.getElementById('chartVehiculos'), {
                type: 'bar',
                data: { labels: Object.keys(vehiculos), datasets: [{ label: 'Cant.', data: Object.values(vehiculos), backgroundColor: '#2d3748' }] }
            });

        } catch (e) { 
            alert("Todavía hay un desajuste con las columnas de Supabase"); 
        }
    }
    loadStats();
</script>
</body>
</html>

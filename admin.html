<script>
    // Usamos un proxy para saltarnos el bloqueo de CORS
    const PROXY = "https://corsproxy.io/?";
    const BASE_URL = "https://ebzkikyajxcqnpdxhpjw.supabase.co/rest/v1/reportes?select=*";
    const URL = PROXY + encodeURIComponent(BASE_URL);
    
    const KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViemtpa3lhanhjcW5wZHhocGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDgyODIsImV4cCI6MjA5MzcyNDI4Mn0.u9Lyz-iLDpVNPVGCKv-CC50iY6lY4L-pqSyhglawOrs";

    async function cargarDatos() {
        try {
            const respuesta = await fetch(URL, {
                method: 'GET',
                headers: {
                    "apikey": KEY,
                    "Authorization": "Bearer " + KEY
                }
            });

            const datos = await respuesta.json();
            
            // Si llegamos aquí, ¡el CORS ya no es un problema!
            document.getElementById('total').innerText = datos.length;

            const tipos = {};
            const matriculas = {};

            datos.forEach(item => {
                if (item.tipo) tipos[item.tipo] = (tipos[item.tipo] || 0) + 1;
                if (item.matricula) matriculas[item.matricula] = (matriculas[item.matricula] || 0) + 1;
            });

            new Chart(document.getElementById('c1'), {
                type: 'pie',
                data: {
                    labels: Object.keys(tipos),
                    datasets: [{
                        data: Object.values(tipos),
                        backgroundColor: ['#4299e1', '#ed8936', '#48bb78', '#f6e05e', '#9f7aea']
                    }]
                }
            });

            new Chart(document.getElementById('c2'), {
                type: 'bar',
                data: {
                    labels: Object.keys(matriculas),
                    datasets: [{
                        label: 'Reportes',
                        data: Object.values(matriculas),
                        backgroundColor: '#2d3748'
                    }]
                },
                options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });

        } catch (error) {
            console.error("Error:", error);
            document.getElementById('error-msg').style.display = 'block';
            document.getElementById('error-msg').innerText = "Aún no hay datos o el proxy está cargando...";
        }
    }
    cargarDatos();
</script>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Control Flota</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .stats { font-size: 2em; font-weight: bold; color: #3498db; }
        canvas { max-width: 100%; height: 300px !important; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Panel de Estadísticas</h2>
        
        <div class="card">
            <div>Total de Reportes</div>
            <div class="stats" id="total">0</div>
        </div>

        <div class="card">
            <h3>Tipos de Avería</h3>
            <canvas id="chartTipos"></canvas>
        </div>

        <div class="card">
            <h3>Reportes por Matrícula</h3>
            <canvas id="chartMats"></canvas>
        </div>
    </div>

    <script>
        const URL = "https://ebzkikyajxcqnpdxhpjw.supabase.co/rest/v1/reportes";
        const KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImViemtpa3lhanhjcW5wZHhocGp3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNDgyODIsImV4cCI6MjA5MzcyNDI4Mn0.u9Lyz-iLDpVNPVGCKv-CC50iY6lY4L-pqSyhglawOrs";

        async function cargarDashboard() {
            try {
                const res = await fetch(URL, {
                    headers: { "apikey": KEY, "Authorization": "Bearer " + KEY }
                });
                const data = await res.json();
                
                document.getElementById('total').innerText = data.length;

                const tipos = {};
                const mats = {};

                data.forEach(r => {
                    if(r.tipo) tipos[r.tipo] = (tipos[r.tipo] || 0) + 1;
                    if(r.matricula) mats[r.matricula] = (mats[r.matricula] || 0) + 1;
                });

                // Gráfico Circular
                new Chart(document.getElementById('chartTipos'), {
                    type: 'pie',
                    data: {
                        labels: Object.keys(tipos),
                        datasets: [{
                            data: Object.values(tipos),
                            backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF']
                        }]
                    }
                });

                // Gráfico de Barras
                new Chart(document.getElementById('chartMats'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(mats),
                        datasets: [{
                            label: 'Nº de Averías',
                            data: Object.values(mats),
                            backgroundColor: '#34495e'
                        }]
                    },
                    options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
                });

            } catch (error) {
                console.error("Error cargando datos:", error);
                alert("Error al conectar con la base de datos. Asegúrate de que el CORS esté configurado.");
            }
        }

        cargarDashboard();
    </script>
</body>
</html>
